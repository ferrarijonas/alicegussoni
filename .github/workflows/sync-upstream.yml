name: sync-upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clona upstream (publico)
        run: git clone --depth 1 https://github.com/ferrarijonas/paodeverdade.git "$RUNNER_TEMP/upstream"
      - name: Copia arquivos compartilhados
        run: |
          files=(
            "assets/js/main.js" "assets/js/main.min.js"
            "assets/js/analytics.js" "assets/js/analytics.min.js"
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            cp "$RUNNER_TEMP/upstream/$f" "$f"
          done
      - name: Commit se houver mudanca
        run: |
          if git diff --quiet; then
            echo "sem mudancas"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "sync upstream @ $(git -C "$RUNNER_TEMP/upstream" rev-parse --short HEAD)"
            git push
          fi